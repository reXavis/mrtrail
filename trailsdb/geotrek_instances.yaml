# Geotrek instances.
#
# Geotrek is not one source but ~80 independently operated deployments, each
# with its own data, its own vocabulary ids and its own terms. The adapter
# reads this file: an instance with an `api` is pulled; an instance whose
# `licence` is null is pulled but cannot ship (the source stays unverified
# until every instance it exports has terms read from the operator's own
# text); an instance whose `licence` is "closed" is skipped entirely.
#
# Discovery: geotrek.fr's users map (utilisateurs.geotrek.fr/clients_map.geojson)
# lists deployments and their public portals; each portal's HTML embeds the
# admin API base it talks to. Trek counts are from the day of discovery.

instances:

  communaute-de-communes-alberes-cote-vermeille:
    name: "Communauté de Communes Albères Côte Vermeille"
    portal: "http://rando.tourisme-pyrenees-mediterranee.fr"
    api: "https://geotrek.tourisme-pyrenees-mediterranee.fr/api/v2"
    treks: 240
    licence: null
    attribution: "Communauté de Communes Albères Côte Vermeille"
    verified_on: null

