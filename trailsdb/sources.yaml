# The source registry.
#
# Everything legal in this project reads from this file: the per-feature
# license/attribution stamps, the app's "Data sources & licenses" screen, and the
# export gate that keeps unverified sources out of shipped packs. Adding a
# country means adding an entry here -- never new legal UI work.
#
# Rules encoded by the loader (trailsdb/registry.py):
#   * every source names a license that exists in `licenses:` below;
#   * every source carries a verbatim `attribution` string, reproduced exactly as
#     the publisher prescribes it -- these are not paraphrases;
#   * `legal.verified_on` is null until a human has read the publisher's terms and
#     confirmed both the license id and the attribution wording. `trailsdb export`
#     refuses unverified sources unless explicitly overridden, so nothing
#     unconfirmed can reach a shipped pack.

version: 1

licenses:
  cc0-1.0:
    name: "Creative Commons Zero v1.0 Universal"
    url: "https://creativecommons.org/publicdomain/zero/1.0/"
    family: public-domain
    attribution_required: false
    share_alike: false

  us-public-domain:
    name: "U.S. Government work, not subject to domestic copyright (17 U.S.C. 105)"
    url: "https://www.usa.gov/government-works"
    family: public-domain
    attribution_required: false
    share_alike: false

  cc-by-4.0:
    name: "Creative Commons Attribution 4.0 International"
    url: "https://creativecommons.org/licenses/by/4.0/"
    family: attribution
    attribution_required: true
    share_alike: false

  cc-by-3.0-au:
    name: "Creative Commons Attribution 3.0 Australia"
    url: "https://creativecommons.org/licenses/by/3.0/au/"
    family: attribution
    attribution_required: true
    share_alike: false

  cc-by-sa-4.0:
    name: "Creative Commons Attribution-ShareAlike 4.0 International"
    url: "https://creativecommons.org/licenses/by-sa/4.0/"
    family: share-alike
    attribution_required: true
    share_alike: true

  cc-by-sa-2.0:
    name: "Creative Commons Attribution-ShareAlike 2.0 Generic"
    url: "https://creativecommons.org/licenses/by-sa/2.0/"
    family: share-alike
    attribution_required: true
    share_alike: true

  odbl-1.0:
    name: "Open Data Commons Open Database License v1.0"
    url: "https://opendatacommons.org/licenses/odbl/1-0/"
    family: share-alike
    attribution_required: true
    share_alike: true
    # The ECF's prescribed ODbL notice names the date the tracks were
    # downloaded, so attribution is templated at pull time.
    dated_attribution: true

  nlod-2.0:
    name: "Norwegian Licence for Open Government Data (NLOD) 2.0"
    url: "https://data.norge.no/nlod/en/2.0"
    family: attribution
    attribution_required: true
    share_alike: false

  ogl-ontario-1.0:
    name: "Open Government Licence - Ontario"
    url: "https://www.ontario.ca/page/open-government-licence-ontario"
    family: attribution
    attribution_required: true
    share_alike: false

  ogl-bc-2.0:
    name: "Open Government Licence - British Columbia"
    url: "https://www2.gov.bc.ca/gov/content?id=A519A56BC2BF44E4A008B33FCF527F61"
    family: attribution
    attribution_required: true
    share_alike: false

  ogl-uk-3.0:
    name: "Open Government Licence v3.0 (United Kingdom)"
    url: "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
    family: attribution
    attribution_required: true
    share_alike: false

  opendata-swiss-by:
    name: "Open use with attribution (opendata.swiss / swisstopo terms)"
    url: "https://www.geocatalog.ch/terms-of-use"
    family: attribution
    attribution_required: true
    share_alike: false

  per-instance:
    name: "Determined per instance at ingest"
    url: ""
    family: unknown
    attribution_required: true
    share_alike: false
    # Geotrek is ~60 independently operated portals. The adapter reads each
    # instance's declared license, records it, and skips anything that is not an
    # open licence already present in this registry.
    resolved_at_ingest: true


sources:

  # ---------------------------------------------------------------- Spain ---
  # The CNIG trio share one adapter and one download flow (a scripted POST
  # against the Centro de Descargas, free account, ~9,900 files). They are the
  # plan's first concrete step: fiddliest pull, and they light up the live
  # Galicia pack immediately.

  cnig_fedme:
    name: "Senderos homologados FEDME"
    publisher: "Centro Nacional de Informacion Geografica (CNIG) / FEDME"
    countries: ["ES"]
    adapter: cnig
    series: fedme
    rate_limit_s: 1.5
    feature_class: route
    default_kind: hiking
    estimated_km: 50000
    km_confidence: official
    cadence: quarterly
    license: cc-by-4.0
    attribution: "Obra derivada de FEDME 2020-2026 CC-BY 4.0 FEDME"
    homepage: "https://centrodedescargas.cnig.es/CentroDescargas/home"
    health_check:
      url: "https://centrodedescargas.cnig.es/CentroDescargas/home"
      expect_status: 200
    legal:
      verified_on: 2026-09-04
      notes: >-
        Verified against the publisher's own text. The download centre's data
        policy (centrodedescargas.cnig.es/CentroDescargas/politica-datos) puts
        IGN products under Orden FOM/2807/2015, whose conditions "se concretan
        en una licencia de uso, compatible con CC-BY 4.0". The licence document
        (ign.es/resources/licencia/Condiciones_licenciaUso_IGN.pdf) prescribes
        the credit "<identificador del producto> <fecha> CC-BY 4.0 <atribucion
        de productores>", values taken from the SCNE product table
        (scne.es/tablaProductos.php), and adds "Obra derivada de" in front when
        the licensee generates a derived work. The table row for this product:
        Senderos FEDME | identifier FEDME | fecha 2020-2026 | reconocimiento
        "FEDME 2020-2026 CC-BY 4.0 FEDME" | productores "Federacion Espanola
        de Deportes de Montana y Escalada (FEDME)". Pack tiles simplify the
        geometry and carry a subset of the attributes, so the derived-work form
        is used. The fecha range in the table grows with each release; re-read
        the row at every quarterly refresh. 6,923 files listed (GPX + KML
        pairs).

  cnig_camino:
    name: "Camino de Santiago (all variants)"
    publisher: "Centro Nacional de Informacion Geografica (CNIG) / FEAACS"
    countries: ["ES", "FR", "PT"]
    adapter: cnig
    series: camino
    rate_limit_s: 1.5
    feature_class: route
    default_kind: hiking
    estimated_km: 25000
    km_confidence: assumed
    cadence: quarterly
    license: cc-by-4.0
    attribution: "Obra derivada de Rutas de Caminos de Santiago 2020-2026 CC-BY 4.0 FEAACS"
    homepage: "https://centrodedescargas.cnig.es/CentroDescargas/home"
    health_check:
      url: "https://centrodedescargas.cnig.es/CentroDescargas/home"
      expect_status: 200
    legal:
      verified_on: 2026-09-04
      notes: >-
        Same IGN licence and verification as cnig_fedme. The SCNE product table
        row: Rutas de Caminos de Santiago | identifier "Rutas de Caminos de
        Santiago" | fecha 2020-2026 | reconocimiento "Rutas de Caminos de
        Santiago 2020-2026 CC-BY 4.0 FEAACS" | productores "Federacion Espanola
        de Asociaciones de Amigos del Camino de Santiago (FEAACS) y Asociaciones
        Jacobeas Espanolas y Europeas colaboradoras con la FEAACS". The
        download centre lists exactly 2,221 files for this series -- the stage
        count the plan predicted.

  cnig_camino_cid:
    name: "Camino del Cid"
    publisher: "Consorcio Camino del Cid / CNIG"
    countries: ["ES"]
    adapter: cnig
    series: camino_cid
    rate_limit_s: 1.5
    feature_class: route
    default_kind: mixed
    estimated_km: 2500
    km_confidence: assumed
    cadence: quarterly
    license: cc-by-4.0
    attribution: "Obra derivada de RCE_CDC 2018-2020 CC-BY 4.0 Camino del CID"
    homepage: "https://centrodedescargas.cnig.es/CentroDescargas/home"
    health_check:
      url: "https://centrodedescargas.cnig.es/CentroDescargas/home"
      expect_status: 200
    legal:
      verified_on: 2026-09-04
      notes: >-
        Same IGN licence and verification as cnig_fedme. The SCNE product table
        row: Camino del Cid | identifier RCE_CDC | fecha 2018-2020 |
        reconocimiento "RCE_CDC 2018-2020 CC-BY 4.0 Camino del CID" |
        productores "Consorcio Camino del CID". Found in the download centre
        alongside the other series (code CACID, 299 files). Walking and cycling
        variants of the same historic route.

  caminos_naturales:
    name: "Caminos Naturales"
    publisher: "Ministerio de Agricultura, Pesca y Alimentacion (MAPA), via the CNIG download centre"
    countries: ["ES"]
    adapter: cnig
    series: caminos_naturales
    rate_limit_s: 1.5
    feature_class: route
    default_kind: mixed
    estimated_km: 10600
    km_confidence: official
    cadence: quarterly
    license: cc-by-4.0
    attribution: "Obra derivada de CNT 2024 CC-BY 4.0 MAPA"
    homepage: "https://centrodedescargas.cnig.es/CentroDescargas/caminos-naturales"
    health_check:
      url: "https://centrodedescargas.cnig.es/CentroDescargas/home"
      expect_status: 200
    legal:
      verified_on: 2026-09-04
      notes: >-
        Same IGN licence and verification as cnig_fedme; this product's page
        in the download centre says: "El producto « Caminos Naturales » son
        itinerarios aportados por el Ministerio de Agricultura, Pesca y
        Alimentacion (mapa.gob.es/es/desarrollo-rural/temas/caminos-naturales)
        CC-BY 4.0 MAPA. Es necesario reconocer siempre la autoria usando las
        siguientes formulas: CNT - 2024". The SCNE product table row: Caminos
        Naturales | identifier CNT | fecha 2024 | reconocimiento "CNT 2024 CC-BY
        4.0 MAPA" | productores "Ministerio de Agricultura, Pesca y
        Alimentacion". MAPA's own download of the same data sits behind a
        reCAPTCHA this pipeline will not pass; the download centre carries it
        as series RTCNT (1,483 files: a GPX and a KML per stage plus one
        shapefile bundle) served from S3 through descargaDirS3, and that is what
        the adapter pulls. The series page says "mas de 10.600 km".

  # ------------------------------------------------------------ New Zealand -
  # DOC's two shapes, sharing one adapter: named experiences a user browses, and
  # the EAM asset network behind them.
  nz_doc:
    name: "DOC walking, tramping and mountain bike routes"
    publisher: "New Zealand Department of Conservation"
    countries: ["NZ"]
    adapter: nz_doc
    series: experiences
    feature_class: route
    default_kind: hiking
    estimated_km: 8000
    km_confidence: assumed
    cadence: quarterly
    license: cc-by-4.0
    attribution: "Crown copyright (c) Department of Conservation (DOC) and the New Zealand Government"
    homepage: "https://doc-deptconservation.opendata.arcgis.com/"
    health_check:
      url: "https://services1.arcgis.com/3JjYDyG3oajxU6HO/arcgis/rest/services/DOC_Walking_Experiences/FeatureServer/1?f=json"
      expect_status: 200
    legal:
      verified_on: 2026-08-27
      notes: >-
        Licence and attribution read from DOC's own item metadata: "Crown
        copyright (c) Department of Conservation (DOC) and the New Zealand
        Government... licensed under the Creative Commons Attribution 4.0
        International License". DOC has flagged these datasets deprecated with no
        replacement published yet; the adapter re-reads that notice on every pull.

  nz_doc_network:
    name: "DOC track network (EAM asset system)"
    publisher: "New Zealand Department of Conservation"
    countries: ["NZ"]
    adapter: nz_doc
    series: network
    feature_class: segment
    default_kind: hiking
    estimated_km: 12000
    km_confidence: assumed
    cadence: quarterly
    license: cc-by-4.0
    attribution: "Crown copyright (c) Department of Conservation (DOC) and the New Zealand Government"
    homepage: "https://doc-deptconservation.opendata.arcgis.com/"
    health_check:
      url: "https://services1.arcgis.com/3JjYDyG3oajxU6HO/arcgis/rest/services/DOC_Tracks_EAM/FeatureServer/0?f=json"
      expect_status: 200
    legal:
      verified_on: 2026-08-27
      notes: >-
        Same licence as nz_doc. Full asset network including tracks with no
        browsable web page, so it renders as infrastructure rather than routes.

  # ---------------------------------------------------------------- Europe --
  eurovelo:
    name: "EuroVelo cycle route network"
    publisher: "European Cyclists' Federation"
    countries: ["EU"]
    adapter: eurovelo
    feature_class: route
    default_kind: cycling
    estimated_km: 60000
    km_confidence: assumed
    cadence: quarterly
    license: odbl-1.0
    attribution: "Contains information from EuroVelo GPX tracks downloaded from www.EuroVelo.com on {retrieved_on}, which is made available here under the Open Database License (ODbL)."
    homepage: "https://en.eurovelo.com/"
    health_check:
      url: "https://en.eurovelo.com/ev1"
      expect_status: 200
    legal:
      verified_on: 2026-08-27
      notes: >-
        Licence read from the ECF's own "License and disclaimer for the use of
        EuroVelo GPX tracks" (December 2025): ODbL, share-alike, with the exact
        dated notice reproduced above verbatim. Share-alike means EuroVelo takes
        its own tile layer and is never merged with the CC BY sources. The ODbL
        keep-open clause applies to any pack carrying it -- the packs are
        DRM-free, which is what makes this shippable.

  swisstopo_wanderwege:
    name: "Wanderwege (Swiss hiking network)"
    publisher: "swisstopo"
    countries: ["CH"]
    adapter: swisstopo
    feature_class: segment
    default_kind: hiking
    estimated_km: 65000
    km_confidence: official
    cadence: quarterly
    license: opendata-swiss-by
    attribution: "Federal Office of Topography swisstopo"
    homepage: "https://www.swisstopo.admin.ch/en/landscape-model-swisstlm3d"
    health_check:
      url: "https://data.geo.admin.ch/api/stac/v0.9/collections/ch.swisstopo.swisstlm3d-wanderwege"
      expect_status: 200
    legal:
      verified_on: 2026-09-04
      notes: >-
        Terms read from swisstopo's own page: standard digital products have
        been free of charge as open government data since 1 March 2021; a
        source reference is mandatory, and "Federal Office of Topography
        swisstopo" is one of the prescribed forms (alongside "(c)swisstopo" and
        the same name in the national languages). 409,276 segments, not the
        ~351k assumed, and every row is a trail. Read from the GeoPackage with
        the stdlib -- no GDAL.

  kartverket_turrutebasen:
    name: "Turrutebasen"
    publisher: "Kartverket"
    countries: ["NO"]
    adapter: kartverket
    feature_class: route
    default_kind: hiking
    estimated_km: 80000
    km_confidence: assumed
    cadence: quarterly
    license: cc-by-4.0
    attribution: "© Kartverket"
    homepage: "https://kartkatalog.geonorge.no/metadata/turrutebasen/d1422d17-6d95-4ef1-96ab-8af31744dd63"
    health_check:
      url: "https://wfs.geonorge.no/skwms1/wfs.turogfriluftsruter?service=WFS&request=GetCapabilities&version=2.0.0"
      expect_status: 200
    legal:
      verified_on: 2026-09-04
      notes: >-
        Verified against Kartverket's own terms
        (kartverket.no/api-og-data/vilkar-for-bruk): "Kartverkets gratisprodukt
        er lisensierte etter Creative Commons Navngivelse 4.0 international (CC
        BY 4.0)", and the credit "skal visast i alle samanhengar der produkta
        eller uttrekk av produkta blir brukt [...] pa folgjande mate: ©
        Kartverket. Det skal ogsa linkast til nettsidene vare der det er
        mogleg." Turrutebasen is one of those free products: its Geonorge record
        (uuid d1422d17-6d95-4ef1-96ab-8af31744dd63) has AccessConstraints "Apne
        data", "No conditions apply to access and use", UseConstraints "Lisens",
        owner and publisher Kartverket. The link requirement is met by the
        homepage in the licences payload and each feature's source_url.
        166,434 features across foot, ski, bike and other routes, served as GML
        only.

  naturvardsverket:
    name: "Vandringsleder"
    publisher: "Naturvardsverket"
    countries: ["SE"]
    adapter: naturvardsverket
    feature_class: route
    default_kind: hiking
    estimated_km: 15000
    km_confidence: assumed
    cadence: quarterly
    license: cc0-1.0
    attribution: "Naturvardsverket (CC0)"
    homepage: "https://geodata.naturvardsverket.se/nedladdning/friluftsliv/"
    health_check:
      url: "https://geodata.naturvardsverket.se/nedladdning/friluftsliv/"
      expect_status: 200
    legal:
      verified_on: 2026-09-04
      notes: >-
        From the publisher's own description of the open data ("Leder och
        friluftsanordningar - beskrivning av oppna data"): "Data publiceras
        enligt licenstypen CC0 vilket betyder att data kan anvandas utan
        begransningar. Naturvardsverket ser garna att det ges en referens, om
        mojligt." CC0 requires no attribution; the reference they ask for is
        given anyway. Two GeoJSON files (Leder, Statliga_Leder) in SWEREF99 TM,
        reprojected with a built-in transverse-Mercator inverse.

  uk_national_trails:
    name: "National Trails"
    publisher: "Natural England / Natural Resources Wales"
    countries: ["GB"]
    adapter: uk_national_trails
    feature_class: route
    default_kind: hiking
    estimated_km: 8000
    km_confidence: official
    cadence: quarterly
    license: ogl-uk-3.0
    attribution: "(c) Natural England. Contains public sector information licensed under the Open Government Licence v3.0."
    homepage: "https://www.nationaltrail.co.uk/"
    health_check:
      url: "https://services.arcgis.com/JJzESW51TqeY9uat/arcgis/rest/services/National_Trails_England/FeatureServer/0?f=json"
      expect_status: 200
    legal:
      verified_on: 2026-08-27
      notes: >-
        Natural England's own ArcGIS organisation; the dataset licence is OGL
        v3.0 and the layer names carry "(c) Natural England". Two layers: the 14
        National Trails (4,111 km, an official figure) and the 17,489 sections of
        the King Charles III England Coast Path, whose not-yet-opened sections are
        dropped. Wales and Scotland are separate publishers.

  geotrek:
    name: "Geotrek public instances"
    publisher: "~60 independent French territorial operators"
    countries: ["FR"]
    adapter: geotrek
    feature_class: route
    default_kind: hiking
    estimated_km: 65000
    km_confidence: assumed
    cadence: quarterly
    license: per-instance
    attribution: "{instance_attribution}"
    homepage: "https://geotrek.fr/"
    health_check:
      url: "https://geotrek.fr/"
      expect_status: 200
    legal:
      verified_on: null
      notes: >-
        Eleven instances discovered with working APIs (geotrek_instances.yaml),
        about 3,360 treks, five of them in the Pyrenees. None is verified: the
        API carries no licence, and the one operator legal page read so far
        (Ecrins) is silent on the trek data. Instances are pulled for analysis
        and ship only once their terms are read from the operator's own text --
        silence is not permission.

  refuges_info:
    name: "refuges.info huts and shelters"
    publisher: "refuges.info"
    countries: ["FR", "ES", "IT", "CH"]
    adapter: refuges_info
    feature_class: spot
    default_kind: hiking
    estimated_km: 0
    km_confidence: official
    cadence: quarterly
    license: cc-by-sa-2.0
    attribution: "© refuges.info contributors, CC BY-SA 2.0"
    homepage: "https://www.refuges.info/"
    health_check:
      url: "https://www.refuges.info/api/"
      expect_status: 200
    legal:
      verified_on: 2026-09-04
      notes: >-
        Share-alike, and 2.0 rather than the 4.0 the plan assumed: the API
        documentation (refuges.info/api/) says "Les donnees du site
        Refuges.info sont sous licence CC By-Sa 2.0, cependant l'API permet
        aussi de retourner des donnees provenant d'OpenStreetMap [...] ces
        donnees sont sous licence ODbL" -- so only the site's own points may
        be taken, never the OSM search results. It also describes itself as
        "un service web personnel et non commercial"; the bbox export is
        read-only, needs no key, and returns GeoJSON points (cabane, refuge,
        gite, bivouac...). Points, not lines: the schema's "spot" class.
        Every API response repeats the licence in its copyright line and the
        pull checks it on every page. Stays in its own layer and its own spots
        file; it must never be combined with any other source's geometry or
        attributes.

  # --------------------------------------------------------------- Americas -
  # US sources are pulled from government endpoints only. Esri-hosted mirrors of
  # the same data attach Esri's terms of use, which the public-domain status of
  # the underlying work does not override.
  usfs_trails:
    name: "National Forest System Trails"
    publisher: "USDA Forest Service"
    countries: ["US"]
    adapter: usfs
    feature_class: segment
    default_kind: hiking
    estimated_km: 257000
    km_confidence: official
    cadence: quarterly
    license: us-public-domain
    attribution: "USDA Forest Service"
    homepage: "https://data.fs.usda.gov/geodata/edw/datasets.php"
    health_check:
      url: "https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_TrailNFSPublish_01/MapServer/0?f=json"
      expect_status: 200
    legal:
      verified_on: 2026-08-27
      notes: >-
        A work of the US federal government, not subject to domestic copyright
        (17 U.S.C. 105). Pulled from the USDA EDW endpoint only -- Esri-hosted
        mirrors of the same data attach Esri terms of use that the underlying
        public-domain status does not override. 86,303 segments; official figure
        160,000 miles. The plan budgeted a 118 MB file geodatabase and the GDAL
        dependency it implies, but the EDW REST service serves the same data as
        GeoJSON, so no such dependency is needed.

  nps_trails:
    name: "National Park Service trails"
    publisher: "US National Park Service"
    countries: ["US"]
    adapter: nps
    feature_class: segment
    default_kind: hiking
    estimated_km: 40000
    km_confidence: assumed
    cadence: quarterly
    license: us-public-domain
    attribution: "US National Park Service"
    homepage: "https://public-nps.opendata.arcgis.com/"
    health_check:
      url: "https://mapservices.nps.gov/arcgis/rest/services/NationalDatasets/NPS_Public_Trails_Geographic/FeatureServer/0?f=json"
      expect_status: 200
    legal:
      verified_on: 2026-08-27
      notes: >-
        A work of the US federal government, not subject to domestic copyright
        (17 U.S.C. 105). Pulled from NPS's own mapservices.nps.gov endpoint, not
        the Esri-hosted mirrors. 31,541 segments; trails NPS marks Proposed or
        Abandoned are dropped at normalize. Heavy overlap with USFS remains to
        be deduplicated in phase 5.

  usgs_ndt:
    name: "National Digital Trails"
    publisher: "US Geological Survey"
    countries: ["US"]
    adapter: usgs_ndt
    feature_class: segment
    default_kind: hiking
    estimated_km: 35000
    km_confidence: assumed
    cadence: quarterly
    license: us-public-domain
    attribution: "US Geological Survey"
    homepage: "https://www.usgs.gov/"
    health_check:
      url: "https://www.usgs.gov/"
      expect_status: 200
    legal:
      verified_on: null
      notes: >-
        No public bulk endpoint found. The National Digital Trails product is
        absent from the TNM Access API, ScienceBase and ArcGIS Online item
        search as of 2026-09-04. It was always the assumed, overlap-heavy third
        leg of the US dedup triangle; USFS and NPS between them already carry
        260,000 km of the federal estate. Revisit if USGS publishes it.

  ontario_otn:
    name: "Ontario Trail Network"
    publisher: "Government of Ontario"
    countries: ["CA"]
    adapter: ontario_otn
    feature_class: segment
    default_kind: mixed
    estimated_km: 35000
    km_confidence: assumed
    cadence: quarterly
    license: ogl-ontario-1.0
    attribution: "Contains information licensed under the Open Government Licence - Ontario."
    homepage: "https://geohub.lio.gov.on.ca/"
    health_check:
